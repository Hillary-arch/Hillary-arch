name: sautihealth-web

on:
  push:
    branches: [main]
    paths: ["sautihealth-web/**", ".github/workflows/sautihealth-web.yml"]
  pull_request:
    paths: ["sautihealth-web/**", ".github/workflows/sautihealth-web.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sautihealth-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sautihealth-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
